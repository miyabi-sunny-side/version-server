name: Release container

on:
  # Manual runs must select a v-prefixed tag ref.
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag and locked package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          with open("Cargo.toml", "rb") as f:
              package = tomllib.load(f)["package"]
          with open("Cargo.lock", "rb") as f:
              locked = tomllib.load(f)["package"]
          version = package["version"]
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version), version
          assert os.environ["RELEASE_TAG"] == "v" + version, "tag/package mismatch"
          local = [p for p in locked if p["name"] == package["name"] and "source" not in p]
          assert len(local) == 1 and local[0]["version"] == version, "lock/package mismatch"
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image from tagged source
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:build-cache,mode=max

      - name: Verify published image digest
        id: digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE:${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{ json .Manifest.Digest }}' | tr -d '"')
          test -n "$BUILD_DIGEST"
          test "$digest" = "$BUILD_DIGEST"
          echo "image=$ref@$digest" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Image: \`$RELEASE_IMAGE\`"
